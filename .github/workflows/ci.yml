name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `tests/book.rs` builds the fixture book and checks that mdbook's parser
      # kept the HTML we emit in one piece — a failure invisible to the unit
      # tests and to the build itself. `MDBOOK_REQUIRED=1` turns the test's
      # local skip into a failure, so a missing mdbook reports as a missing
      # mdbook rather than as a green run that checked nothing.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - run: MDBOOK_REQUIRED=1 cargo test --verbose
