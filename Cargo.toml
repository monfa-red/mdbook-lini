[package]
name = "mdbook-lini"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "mdbook preprocessor: every figure from plain text — diagrams, charts, sequences, mindmaps, schematics, and technical drawings, rendered to inline SVG"
license = "MIT"
repository = "https://github.com/monfa-red/mdbook-lini"
homepage = "https://lini.rs"
documentation = "https://lini.rs"
readme = "README.md"
keywords = ["mdbook", "preprocessor", "diagram", "svg", "lini"]
categories = ["command-line-utilities", "visualization"]
include = ["src/**/*", "README.md", "LICENSE", "mdbook-lini.css"]

[dependencies]
# A caret range again, now that 1.0 is out: every 1.x is compatible by the
# compiler's own promise, so a reader's install takes the newest fixes. The
# exact pin the pre-releases needed — Cargo treats every 1.0.0-rc as
# compatible with every other, so a range floated to an rc this crate was
# never built against — is retired with them.
lini = "1.0"
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
